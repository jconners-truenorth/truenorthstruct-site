<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>True North Structural Engineering</title>

  <!-- IBM Plex Sans -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'IBM Plex Sans', sans-serif;
      text-align: center;
      color: #1f2a37;
    }

    .container {
      max-width: 720px;
      padding: 20px;
    }

    img {
      max-width: 320px;
      height: auto;
      margin-bottom: 70px;
    }

    .hero {
      font-size: 22px;
      font-weight: 500; /* slightly firmer */
      letter-spacing: 0.3px;
      margin-bottom: 28px;
      color: #1f2a37;
    }

    .note {
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #777;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="assets/images/truenorthlogo-primary.png" alt="True North Structural Engineering Logo">
    <div class="hero">Clear design. Confident construction.</div>
    <div class="note">
      Thank you for visiting<br>
      Full site coming soon
    </div>
  </div>
</body>
</html>
