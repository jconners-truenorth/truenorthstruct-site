<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact | True North Structural Engineering</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <div id="header"></div>

    <main>

        <section>
            <h1>Contact</h1>

            <p>
                Call or text to discuss your project, or use the form below to provide initial details.
            </p>

            <p>
                <strong>Email:</strong>
                <a href="mailto:jconners.truenorth@outlook.com">
                    jconners.truenorth@outlook.com
                </a>
                <br>
                <strong>Phone:</strong>
                <a href="tel:19708195938">
                    (970) 819-5938
                </a>
            </p>

        </section>

        <section>

            <form action="https://formspree.io/f/mvzvqybz" method="POST">

                <input type="hidden" name="_subject" value="New Inquiry - True North Structural Engineering">
                <input type="hidden" name="_next" value="https://truenorthstruct.com/thank-you.html">

                <div>
                    <label>Full Name *</label>
                    <input type="text" name="name" required>
                </div>

                <div>
                    <label>Email *</label>
                    <input type="email" name="email" required>
                </div>

                <div>
                    <label>Phone *</label>
                    <input type="tel" name="phone" required>
                </div>

                <div>
                    <label>Title</label>
                    <input type="text" name="title">
                </div>

                <div>
                    <label>Company</label>
                    <input type="text" name="company">
                </div>

                <div>
                    <label>Project Name</label>
                    <input type="text" name="project">
                </div>

                <div>
                    <label>Project Description</label>
                    <textarea name="message"></textarea>
                </div>

                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <script src="assets/js/load-header.js"></script>

</body>

</html>
