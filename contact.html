<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact | True North Structural Engineering</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact True North Structural Engineering to discuss residential structural design for homes, remodels, additions, and foundations.">
    <link rel="canonical" href="https://truenorthstruct.com/contact.html">
    <meta property="og:title" content="Contact | True North Structural Engineering">
    <meta property="og:description"
        content="Call, email, or send project details to True North Structural Engineering.">
    <meta property="og:url" content="https://truenorthstruct.com/contact.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="True North Structural Engineering">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <div id="header"></div>

    <main>

        <section>
            <h1>Contact</h1>

            <p>
                Call or text to discuss your project, or use the form below to provide initial details.
            </p>

            <p>
                <strong>Email:</strong>
                <a href="mailto:jconners.truenorth@outlook.com">
                    jconners.truenorth@outlook.com
                </a>
                <br>
                <strong>Phone:</strong>
                <a href="tel:19708195938">
                    (970) 819-5938
                </a>
            </p>

        </section>

        <section>

            <form action="https://formspree.io/f/mvzvqybz" method="POST">

                <input type="hidden" name="_subject" value="New Inquiry - True North Structural Engineering">
                <input type="hidden" name="_next" value="https://truenorthstruct.com/thank-you.html">

                <div>
                    <label for="name">Full Name *</label>
                    <input id="name" type="text" name="name" required>
                </div>

                <div>
                    <label for="email">Email *</label>
                    <input id="email" type="email" name="email" required>
                </div>

                <div>
                    <label for="phone">Phone *</label>
                    <input id="phone" type="tel" name="phone" required>
                </div>

                <div>
                    <label for="title">Title</label>
                    <input id="title" type="text" name="title">
                </div>

                <div>
                    <label for="company">Company</label>
                    <input id="company" type="text" name="company">
                </div>

                <div>
                    <label for="project">Project Name</label>
                    <input id="project" type="text" name="project">
                </div>

                <div>
                    <label for="message">Project Description</label>
                    <textarea id="message" name="message"></textarea>
                </div>

                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <script src="assets/js/load-header.js"></script>

</body>

</html>
